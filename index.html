<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego de Cámaras Trampa</title>

  <style>
    :root {
      --fondo: #0f1712;
      --panel: #18231b;
      --panel-2: #223126;
      --texto: #f5f7f5;
      --texto-suave: #c9d2cb;
      --verde: #7bc47f;
      --verde-oscuro: #4b8b52;
      --rojo: #e45b5b;
      --amarillo: #f1c75b;
      --borde: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #24362a 0%, #101712 48%, #0b100c 100%);
      color: var(--texto);
    }

    button {
      font: inherit;
    }

    .pantalla {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .pantalla.activa {
      display: flex;
    }

    .inicio-card,
    .fin-card {
      width: min(680px, 100%);
      text-align: center;
      background: rgba(24, 35, 27, 0.95);
      border: 1px solid var(--borde);
      border-radius: 24px;
      padding: 42px 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .inicio-card h1,
    .fin-card h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    .inicio-card p,
    .fin-card p {
      color: var(--texto-suave);
      font-size: 1.08rem;
      line-height: 1.55;
      max-width: 560px;
      margin: 0 auto 26px;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .btn-principal {
      background: var(--verde);
      color: #102014;
      font-size: 1.08rem;
    }

    .juego {
      width: min(1180px, 100%);
      margin: auto;
    }

    .barra-superior {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .titulo-juego {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .estado {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--borde);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--texto-suave);
    }

    .vidas {
      letter-spacing: 2px;
      font-size: 1.2rem;
    }

    .contenedor-foto {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--borde);
      background: #050706;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      user-select: none;
    }

    #fotoJuego {
      display: block;
      width: 100%;
      height: auto;
      max-height: 76vh;
      object-fit: contain;
      cursor: crosshair;
    }

    .marcador-acierto {
      position: absolute;
      border: 4px solid #6ee77a;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 25px rgba(110,231,122,0.8);
      pointer-events: none;
      display: none;
      animation: pulso 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulso {
      from { transform: translate(-50%, -50%) scale(0.94); }
      to   { transform: translate(-50%, -50%) scale(1.05); }
    }

    .mensaje {
      min-height: 32px;
      margin-top: 12px;
      font-weight: 700;
      text-align: center;
    }

    .mensaje.error {
      color: #ff8585;
    }

    .mensaje.ok {
      color: #8deb95;
    }

    .modal-fondo {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.72);
      z-index: 20;
    }

    .modal-fondo.activo {
      display: flex;
    }

    .modal {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: minmax(230px, 0.9fr) 1.1fr;
    }

    .modal-imagen {
      min-height: 300px;
      background: #0a0e0b;
    }

    .modal-imagen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-contenido {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .correcto {
      margin: 0;
      color: #8deb95;
      font-size: 0.98rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.6px;
    }

    .modal h2 {
      margin: 0;
      font-size: 2rem;
    }

    .modal p {
      margin: 0;
      color: var(--texto-suave);
      line-height: 1.6;
    }

    .modal .btn {
      align-self: flex-start;
      margin-top: 8px;
    }

    @media (max-width: 720px) {
      .pantalla {
        padding: 14px;
      }

      .modal-grid {
        grid-template-columns: 1fr;
      }

      .modal-imagen {
        min-height: 220px;
        max-height: 300px;
      }

      .modal-contenido {
        padding: 22px;
      }

      #fotoJuego {
        max-height: 68vh;
      }
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO -->
  <section id="pantallaInicio" class="pantalla activa">
    <div class="inicio-card">
      <h1>Cámaras Trampa</h1>
      <p>
        Encontrá al animal escondido en cada fotografía. Tenés
        <strong>3 vidas</strong> para completar las 5 imágenes.
      </p>
      <button id="btnIniciar" class="btn btn-principal">Iniciar juego</button>
    </div>
  </section>

  <!-- PANTALLA DEL JUEGO -->
  <section id="pantallaJuego" class="pantalla">
    <main class="juego">
      <div class="barra-superior">
        <div class="titulo-juego">Encontrá el animal</div>

        <div class="estado">
          <div id="progreso" class="chip">Foto 1 de 5</div>
          <div class="chip">Vidas: <span id="vidas" class="vidas">❤️❤️❤️</span></div>
        </div>
      </div>

      <div id="contenedorFoto" class="contenedor-foto">
        <img id="fotoJuego" src="foto1.jpeg" alt="Fotografía de cámara trampa" draggable="false" />
        <div id="marcadorAcierto" class="marcador-acierto"></div>
      </div>

      <div id="mensaje" class="mensaje"></div>
    </main>
  </section>

  <!-- PANTALLA FINAL -->
  <section id="pantallaFin" class="pantalla">
    <div class="fin-card">
      <h1 id="tituloFin">¡Completado!</h1>
      <p id="textoFin">Encontraste todos los animales.</p>
      <button id="btnReiniciar" class="btn btn-principal">Jugar de nuevo</button>
    </div>
  </section>

  <!-- FICHA DEL ANIMAL -->
  <div id="modalFicha" class="modal-fondo">
    <div class="modal">
      <div class="modal-grid">
        <div class="modal-imagen">
          <img id="imagenFicha" src="" alt="Imagen del animal" />
        </div>

        <div class="modal-contenido">
          <p class="correcto">✓ ¡Correcto!</p>
          <h2 id="nombreAnimal">Nombre del animal</h2>
          <p id="descripcionAnimal">Descripción del animal.</p>
          <button id="btnSiguiente" class="btn btn-principal">Siguiente</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       DATOS DEL JUEGO
       ============================================================

       Todo lo que seguramente quieras cambiar después está acá.

       - foto: imagen de la cámara trampa.
       - imagenFicha: foto que aparece al acertar.
                      Por ahora uso la misma foto de la cámara.
                      Podés cambiarla por, por ejemplo:
                      "animales/puma.jpg"
       - nombre: nombre del animal.
       - descripcion: texto de la ficha.
       - zona: lugar válido para hacer clic.

       cx y cy = centro del animal en porcentaje.
       rx y ry = tamaño permitido del clic en porcentaje.
    */

    const animales = [
      {
        foto: "foto1.jpeg",
        imagenFicha: "foto1.jpeg",
        nombre: "Nombre del animal 1",
        descripcion: "Escribí acá la descripción del animal de la foto 1.",
        zona: { cx: 31, cy: 68, rx: 34, ry: 27 }
      },
      {
        foto: "foto2.jpeg",
        imagenFicha: "foto2.jpeg",
        nombre: "Nombre del animal 2",
        descripcion: "Escribí acá la descripción del animal de la foto 2.",
        zona: { cx: 22, cy: 40.5, rx: 8.5, ry: 10 }
      },
      {
        foto: "foto3.jpeg",
        imagenFicha: "foto3.jpeg",
        nombre: "Nombre del animal 3",
        descripcion: "Escribí acá la descripción del animal de la foto 3.",
        zona: { cx: 56.5, cy: 61.5, rx: 5, ry: 9.5 }
      },
      {
        foto: "foto4.jpeg",
        imagenFicha: "foto4.jpeg",
        nombre: "Nombre del animal 4",
        descripcion: "Escribí acá la descripción del animal de la foto 4.",
        zona: { cx: 10.8, cy: 48.5, rx: 8.5, ry: 15 }
      },
      {
        foto: "foto5.jpeg",
        imagenFicha: "foto5.jpeg",
        nombre: "Nombre del animal 5",
        descripcion: "Escribí acá la descripción del animal de la foto 5.",
        zona: { cx: 46.5, cy: 64.8, rx: 4.3, ry: 4.6 }
      }
    ];

    /*
      Si alguna zona necesita un pequeño ajuste, poné DEBUG en true.
      Cada clic imprimirá en la consola del navegador las coordenadas
      porcentuales X e Y. Después sólo modificás cx y cy arriba.
    */
    const DEBUG = false;

    const VIDAS_INICIALES = 3;

    let indiceActual = 0;
    let vidasActuales = VIDAS_INICIALES;
    let esperandoSiguiente = false;

    const pantallaInicio = document.getElementById("pantallaInicio");
    const pantallaJuego = document.getElementById("pantallaJuego");
    const pantallaFin = document.getElementById("pantallaFin");

    const btnIniciar = document.getElementById("btnIniciar");
    const btnReiniciar = document.getElementById("btnReiniciar");
    const btnSiguiente = document.getElementById("btnSiguiente");

    const fotoJuego = document.getElementById("fotoJuego");
    const progreso = document.getElementById("progreso");
    const vidas = document.getElementById("vidas");
    const mensaje = document.getElementById("mensaje");
    const marcadorAcierto = document.getElementById("marcadorAcierto");

    const modalFicha = document.getElementById("modalFicha");
    const imagenFicha = document.getElementById("imagenFicha");
    const nombreAnimal = document.getElementById("nombreAnimal");
    const descripcionAnimal = document.getElementById("descripcionAnimal");

    const tituloFin = document.getElementById("tituloFin");
    const textoFin = document.getElementById("textoFin");

    function mostrarPantalla(pantalla) {
      pantallaInicio.classList.remove("activa");
      pantallaJuego.classList.remove("activa");
      pantallaFin.classList.remove("activa");
      pantalla.classList.add("activa");
    }

    function iniciarJuego() {
      indiceActual = 0;
      vidasActuales = VIDAS_INICIALES;
      esperandoSiguiente = false;
      modalFicha.classList.remove("activo");
      mostrarPantalla(pantallaJuego);
      cargarFotoActual();
    }

    function cargarFotoActual() {
      const animal = animales[indiceActual];

      fotoJuego.src = animal.foto;
      progreso.textContent = `Foto ${indiceActual + 1} de ${animales.length}`;
      actualizarVidas();

      mensaje.textContent = "Hacé clic sobre el animal.";
      mensaje.className = "mensaje";

      marcadorAcierto.style.display = "none";
      esperandoSiguiente = false;
    }

    function actualizarVidas() {
      vidas.textContent = "❤️".repeat(vidasActuales) + "🖤".repeat(VIDAS_INICIALES - vidasActuales);
    }

    function clicDentroDeZona(x, y, zona) {
      // Comprobación dentro de una elipse.
      const dx = (x - zona.cx) / zona.rx;
      const dy = (y - zona.cy) / zona.ry;
      return (dx * dx + dy * dy) <= 1;
    }

    function procesarClick(evento) {
      if (esperandoSiguiente) return;

      const rect = fotoJuego.getBoundingClientRect();

      const x = ((evento.clientX - rect.left) / rect.width) * 100;
      const y = ((evento.clientY - rect.top) / rect.height) * 100;

      if (DEBUG) {
        console.log(`Click -> x: ${x.toFixed(1)}%, y: ${y.toFixed(1)}%`);
      }

      const animal = animales[indiceActual];

      if (clicDentroDeZona(x, y, animal.zona)) {
        acierto(animal);
      } else {
        error();
      }
    }

    function acierto(animal) {
      esperandoSiguiente = true;

      mensaje.textContent = "¡Correcto! Encontraste al animal.";
      mensaje.className = "mensaje ok";

      // Marca visualmente dónde estaba el animal.
      marcadorAcierto.style.left = `${animal.zona.cx}%`;
      marcadorAcierto.style.top = `${animal.zona.cy}%`;
      marcadorAcierto.style.width = `${animal.zona.rx * 2}%`;
      marcadorAcierto.style.height = `${animal.zona.ry * 2}%`;
      marcadorAcierto.style.display = "block";

      imagenFicha.src = animal.imagenFicha;
      nombreAnimal.textContent = animal.nombre;
      descripcionAnimal.textContent = animal.descripcion;

      btnSiguiente.textContent =
        indiceActual === animales.length - 1 ? "Ver resultado" : "Siguiente";

      setTimeout(() => {
        modalFicha.classList.add("activo");
      }, 450);
    }

    function error() {
      vidasActuales--;
      actualizarVidas();

      if (vidasActuales <= 0) {
        terminarPorDerrota();
        return;
      }

      mensaje.textContent = `Incorrecto. Te quedan ${vidasActuales} ${vidasActuales === 1 ? "vida" : "vidas"}.`;
      mensaje.className = "mensaje error";
    }

    function siguienteFoto() {
      modalFicha.classList.remove("activo");

      if (indiceActual === animales.length - 1) {
        terminarPorVictoria();
        return;
      }

      indiceActual++;
      cargarFotoActual();
    }

    function terminarPorVictoria() {
      tituloFin.textContent = "¡Completado!";
      textoFin.textContent = `Encontraste los 5 animales y terminaste con ${vidasActuales} ${vidasActuales === 1 ? "vida" : "vidas"}.`;
      mostrarPantalla(pantallaFin);
    }

    function terminarPorDerrota() {
      tituloFin.textContent = "Sin vidas";
      textoFin.textContent = `Llegaste hasta la foto ${indiceActual + 1}. Podés volver a intentarlo desde el comienzo.`;
      mostrarPantalla(pantallaFin);
    }

    btnIniciar.addEventListener("click", iniciarJuego);
    btnReiniciar.addEventListener("click", iniciarJuego);
    btnSiguiente.addEventListener("click", siguienteFoto);
    fotoJuego.addEventListener("click", procesarClick);
  </script>
</body>
</html>
